name: Build Foodie Release APK

on:
  push:
    branches:
      - 'refactor/performance-data-integrity'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not configured"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/foodie-release.jks"
          test -s "${{ runner.temp }}/foodie-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/foodie-release.jks
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "STORE_PASSWORD secret is not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is not configured"; exit 1; }
          gradle assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodie-release-validation
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
