name: Build Foodie Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not configured"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/foodie-release.jks"
          test -s "${{ runner.temp }}/foodie-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/foodie-release.jks
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$MAPS_API_KEY" || { echo "MAPS_API_KEY secret is not configured"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "STORE_PASSWORD secret is not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD secret is not configured"; exit 1; }
          gradle clean assembleRelease --no-daemon

      - name: Prepare consistently named APK
        run: |
          set -eu
          mkdir -p dist
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "No release APK was produced"; exit 1; }
          cp "$apk_path" dist/Foodie-release.apk
          test -s dist/Foodie-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Foodie-release-${{ github.run_number }}
          path: dist/Foodie-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Foodie-release.apk \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
